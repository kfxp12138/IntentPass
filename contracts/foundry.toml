[profile.default]
src = "src"
test = "test"
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
remappings = ["@openzeppelin/contracts/=../node_modules/@openzeppelin/contracts/"]
allow_paths = ["../node_modules"]
fs_permissions = [{ access = "read", path = "../fixtures/dev" }]
